apiVersion: v1
kind: Namespace
metadata:
  name: default
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: nfs
  namespace: default
spec:
  chart: nfs-subdir-external-provisioner
  repo: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner
  targetNamespace: default
  set:
    storageClass.name: nfs
  valuesContent: |-
    nfs:
        server: 10.13.13.2
        path: /export
        mountOptions:
        - nfsvers=3